name: Android CI — Al AzharTex Shade Cart

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-and-unit-tests:
    name: Build, Lint & JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions
        run: chmod +x gradlew tools/ci_gradle_annotate.sh

      - name: Run Unit Tests, Lint & Assemble Debug APK
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon 2>&1 | tee gradle.log
        continue-on-error: true

      - name: Annotate compiler errors
        if: always()
        run: ./tools/ci_gradle_annotate.sh gradle.log

      - name: Upload test, lint & build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-lint-reports
          path: |
            gradle.log
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/

      - name: Fail job if Gradle failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

  instrumented-ui-tests:
    name: Instrumented Compose UI Tests (API 35)
    needs: build-lint-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests on Android 15 (API 35) Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
