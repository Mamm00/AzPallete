name: Android CI — Al AzharTex Shade Cart

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-and-unit-tests:
    name: Build, Lint & JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions
        run: chmod +x gradlew tools/ci_gradle_annotate.sh

      - name: Run Unit Tests, Lint & Assemble Debug APK
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle.log
        continue-on-error: true

      - name: Inspect R8 mapping and bytecode (temp diagnostic)
        if: steps.gradle_build.outcome == 'success'
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, subprocess, zipfile

          mapping = pathlib.Path("app/build/outputs/mapping/release/mapping.txt").read_text(errors="replace")
          lines = mapping.splitlines()

          want_orig = {
              "com.google.mlkit.vision.segmentation.subject.internal.SubjectSegmentationRegistrar",
              "com.google.mlkit.vision.text.internal.TextRegistrar",
              "com.google.mlkit.vision.common.internal.VisionCommonRegistrar",
              "com.google.mlkit.common.internal.CommonComponentRegistrar",
              "com.google.firebase.components.ComponentDiscovery",
              "com.google.firebase.components.ComponentDiscovery$MetadataRegistrarNameRetriever",
              "com.google.mlkit.common.internal.MlKitInitProvider",
              "com.google.mlkit.common.sdkinternal.MlKitContext",
          }
          want_obf = {"it2", "cn7", "ep4", "q32", "wi4"}
          cur_orig = ""
          cur_obf = ""
          reg_dump = []
          extra_dump = []
          cevm_obf = set()
          for ln in lines:
              if not ln.startswith(" ") and " -> " in ln and ln.endswith(":"):
                  orig, obf = ln[:-1].split(" -> ", 1)
                  cur_orig, cur_obf = orig.strip(), obf.strip()
                  if cur_orig in want_orig:
                      reg_dump.append(f"[{cur_orig}->{cur_obf}]")
                  if cur_obf in want_obf:
                      extra_dump.append(f"[{cur_orig}->{cur_obf}]")
                  if "CartEditViewModel" in cur_orig and "R8$$REMOVED" not in cur_obf:
                      cevm_obf.add(cur_obf)
              elif cur_orig in want_orig:
                  reg_dump.append(ln.strip())
              elif cur_obf in want_obf:
                  extra_dump.append(f"{cur_obf}:{ln.strip()}")

          reg_txt = " | ".join(reg_dump)
          print(f"::notice::REG_BODY1 {reg_txt[:900]}")
          print(f"::notice::REG_BODY2 {reg_txt[900:1800]}")
          print(f"::notice::EXTRA_MAP {' | '.join(extra_dump)[:900]}")

          apk = sorted(pathlib.Path("app/build/outputs/apk/release").glob("*.apk"))[0]
          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          dexdump = sorted(pathlib.Path(sdk, "build-tools").glob("*/dexdump"))[-1]
          tmp_dex = pathlib.Path("/tmp/rel_dex")
          tmp_dex.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(apk) as zf:
              for name in zf.namelist():
                  if name.endswith(".dex"):
                      zf.extract(name, tmp_dex)

          cevm_desc = {f"L{b.replace('.', '/')};" for b in cevm_obf}
          for dex in sorted(tmp_dex.glob("*.dex")):
              out = subprocess.check_output([str(dexdump), "-d", str(dex)], text=True, errors="replace")
              chunks = out.split("Class descriptor  : ")
              for ch in chunks[1:]:
                  desc = ch.splitlines()[0].strip().strip("'")
                  if desc == "Lft2;":
                      txt = " | ".join(l.strip() for l in ch.splitlines())
                      print(f"::notice::FT2_DEX1 {txt[:900]}")
                      print(f"::notice::FT2_DEX2 {txt[900:1800]}")
                      print(f"::notice::FT2_DEX3 {txt[1800:2700]}")
                  if desc == "Lit2;":
                      txt = " | ".join(l.strip() for l in ch.splitlines()[:60])
                      print(f"::notice::IT2_DEX {txt[:900]}")
                  if desc in cevm_desc and "getClass" in ch:
                      mlines = ch.splitlines()
                      hits = [" // ".join(x.strip() for x in mlines[max(0,i-5):i+5]) for i, ml in enumerate(mlines) if "getClass" in ml]
                      print(f"::notice::CEVM_GC[{desc}] {' || '.join(hits)[:900]}")
          PYEOF

      - name: Annotate compiler errors
        if: always()
        run: ./tools/ci_gradle_annotate.sh gradle.log

      - name: Show Gradle failure tail
        if: steps.gradle_build.outcome != 'success'
        run: |
          tail -n 150 gradle.log
          {
            echo "### Gradle Failure Tail"
            echo '```'
            tail -n 120 gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test, lint & build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-lint-reports
          path: |
            gradle.log
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/

      - name: Fail job if Gradle failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

  instrumented-ui-tests:
    name: Instrumented Compose UI Tests (API 35)
    needs: build-lint-and-unit-tests
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests on Android 15 (API 35) Emulator
        id: android_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee android-gradle.log

      - name: Annotate Android Test Failures
        if: failure()
        run: |
          chmod +x tools/ci_gradle_annotate.sh
          ./tools/ci_gradle_annotate.sh android-gradle.log || true
          python3 - << 'PYEOF'
          import pathlib, xml.etree.ElementTree as ET
          for xml_path in sorted(pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml")):
              try:
                  root = ET.parse(xml_path).getroot()
                  for tc in root.findall("testcase"):
                      fail = tc.find("failure")
                      if fail is not None:
                          cls = tc.attrib.get("classname", "")
                          name = tc.attrib.get("name", "")
                          text = (fail.text or fail.attrib.get("message", "")).strip().replace("\n", " | ")[:900]
                          print(f"::error::AndroidTest FAILED: {cls}.{name} -> {text}")
              except Exception as e:
                  print(f"::warning::Failed parsing {xml_path}: {e}")
          PYEOF

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android-gradle.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
