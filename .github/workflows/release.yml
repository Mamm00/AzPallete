name: Release — Al AzharTex Shade Cart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build, Verify & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permissions
        run: chmod +x gradlew tools/ci_gradle_annotate.sh

      - name: Decode release keystore (if secrets are configured)
        env:
          KS_B64: ${{ secrets.ALAZHARTEX_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ALAZHARTEX_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ALAZHARTEX_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ALAZHARTEX_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ALAZHARTEX_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ALAZHARTEX_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ALAZHARTEX_KEY_ALIAS=$KS_ALIAS"
              echo "ALAZHARTEX_KEY_PASSWORD=$KS_KEY_PASS"
              echo "RELEASE_KEYSTORE_PRESENT=true"
            } >> "$GITHUB_ENV"
            echo "Release keystore configured from secrets."
          else
            echo "RELEASE_KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "No release keystore secrets configured; APK will use debug signing for sideload/QA testing."
          fi

      - name: Run Unit Tests, Lint & Build APKs
        id: gradle_release
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee release-gradle.log
        continue-on-error: true

      - name: Annotate any errors
        if: always()
        run: ./tools/ci_gradle_annotate.sh release-gradle.log

      - name: Fail if Gradle build failed
        if: steps.gradle_release.outcome != 'success'
        run: |
          tail -n 120 release-gradle.log
          exit 1

      - name: Verify release APK signature when keystore is provided
        if: env.RELEASE_KEYSTORE_PRESENT == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.out
          if grep -qi 'Android Debug' /tmp/apksigner.out; then
            echo "::error::Release APK was signed with debug certificate!"
            exit 1
          fi

      - name: Package release assets and checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          mkdir -p release-assets
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          if [ "${RELEASE_KEYSTORE_PRESENT}" = "true" ]; then
            REL_NAME="alazhartex-shadecart-${TAG}.apk"
            SIGN_NOTE="Signed with the Al AzharTex release keystore."
          else
            REL_NAME="alazhartex-shadecart-${TAG}-release-debugsigned.apk"
            SIGN_NOTE="Debug-signed release APK (no repository release keystore secrets configured; suitable for QA/sideloading)."
          fi
          DBG_NAME="alazhartex-shadecart-${TAG}-debug.apk"

          cp "$RELEASE_APK" "release-assets/$REL_NAME"
          cp "$DEBUG_APK" "release-assets/$DBG_NAME"
          (cd release-assets && sha256sum "$REL_NAME" "$DBG_NAME" > SHA256SUMS.txt)

          TAG="$TAG" REL_NAME="$REL_NAME" DBG_NAME="$DBG_NAME" SIGN_NOTE="$SIGN_NOTE" python3 - << 'PYEOF'
          import os, pathlib, re, textwrap

          tag = os.environ["TAG"]
          rel_name = os.environ["REL_NAME"]
          dbg_name = os.environ["DBG_NAME"]
          sign_note = os.environ["SIGN_NOTE"]

          gradle_txt = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          vc_match = re.search(r"versionCode\s*=\s*(\d+)", gradle_txt)
          version_code = vc_match.group(1) if vc_match else "5"

          notes = textwrap.dedent(f"""\
          ## Al AzharTex — Digital Shade Cart ({tag})

          Release `{tag}` of the **Al AzharTex Digital Shade Cart** Android application (`com.alazhartex.shadecart`, `versionCode = {version_code}`), digitizing physical A4 fabric shade carts into Room v2 (`MIGRATION_1_2`) inventory records using metric units (**GSM**, **cm**, **m**).

          ### What's Fixed in {tag}
          - **R8 Release ML Kit Fix (`app/proguard-rules.pro`, `TextRecognitionGateway`, `SubjectSegmentationGateway`)**: Preserved `ComponentRegistrar` constructors (`<init>()`) and `getComponents()` under AGP 9.2.1 R8 full mode so `MlKitInitProvider` properly registers `CommonComponentRegistrar`, `VisionCommonRegistrar`, `TextRegistrar`, and `SubjectSegmentationRegistrar` at startup—eliminating both release-build `NullPointerException` banners on `CartEditScreen` (`InputImage.fromBitmap` / `SubjectSegmentation.getClient`).
          - **OCR Header Parsing (`ShadeCartOcrParser`)**: Added `ITEM NAME :` and `ITEM CODE :` recognition alongside `FABRIC NAME` / `CODE` for physical shade cart headers.
          - **Editor Header Layout (`CartEditScreen`)**: Switched the `Non-Destructive Card Editor` and `Header Metadata (OCR)` headers to `FlowRow` with `maxLines = 1, softWrap = false` action labels so `Boxes` and `Crop` never wrap vertically on narrow phones.

          ### Core Capabilities
          - **Color Science & ShadeLock™ Calibration (`ColorScience`, `ColorCalibrator`, `PureImageMath`)**: Pure Kotlin sRGB/XYZ/CIELAB (`D65`) & CIEDE2000 ΔE₂₀₀₀ perceptual delta calculations, 3-frame median HDR burst stacking, flat-field illumination correction, weave texture analysis, live ambient lux monitor, and saved calibration profiles.
          - **Capture, OCR & Non-Destructive Editing (`CartCaptureScreen`, `CartEditScreen`)**: CameraX viewfinder + live Laplacian focus readout, ML Kit Document Scanner / Photo Picker / Sample A4 asset, CanHub `android-image-cropper`, interactive overlay swatch box editor, ML Kit Text Recognition & Subject Segmentation with crop-only fallback, and `EditStack` process-death restoration.
          - **Mill Hub (`InventoryAndMillScreen`)**: Reverse Shade Finder ranked by ΔE₂₀₀₀, Warehouse Rolls & Dye Lots (`RL-*` QR scanning + printable QR label sheet PDF), meter reservations, cut-piece ledger with `LowStockAlertWorker` notifications, volume price tiers, offline **Ask AzPallete** English/Arabic NL queries, and Mill Insights analytics.
          - **Buyer Showcase & 2.5D Drape (`BuyerShowcaseScreen`, `DrapePreviewDialog`)**: PIN-locked Buyer Showcase mode isolating internal sheds/costs, favorite shade shortlists & quote sharing, and interactive 2.5D fabric drape preview (Shirt, Curtain, Upholstery under D65 / Warm / Cool lighting).
          - **Multi-Format Exporters, Glance Widget, Backup & P2P Sync**: Export to A4 PDF, PNG card, bidi-safe WhatsApp caption, GIMP `.gpl`, Procreate `.swatches`, CSV, and standalone HTML lookbooks; Jetpack Glance home-screen widget; AES-256-GCM encrypted ZIP backup/restore with SHA-256 checksums; Nearby Connections P2P sync; EN/AR localization with RTL & Glove Mode; and Room `withTransaction` + `Mutex` conflict resolution.

          ### Artifacts & Signing
          - `{rel_name}`: {sign_note}
          - `{dbg_name}`: Debug build with test/StrictMode diagnostics.
          - `SHA256SUMS.txt`: SHA-256 verification checksums.
          """)
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          PYEOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "Al AzharTex Digital Shade Cart $TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" release-assets/* \
              --title "Al AzharTex Digital Shade Cart $TAG" \
              --notes-file release_notes.md
          fi
          gh release view "$TAG" --json url --jq .url
